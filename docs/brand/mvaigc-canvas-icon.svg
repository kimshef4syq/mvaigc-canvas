<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2029"/>
      <stop offset="50%" stop-color="#13141a"/>
      <stop offset="100%" stop-color="#0a0b0e"/>
    </linearGradient>

    <!-- Subtle Bezel / Border -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.1"/>
    </linearGradient>

    <!-- 'm' Text Gradient: Cyan -> Electric Blue -> Violet -->
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Atmospheric Glow -->
    <radialGradient id="glowGrad" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Drop Shadow -->
    <filter id="mShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bgGrad)"/>
  
  <!-- Ambient Center Glow -->
  <circle cx="512" cy="512" r="380" fill="url(#glowGrad)"/>

  <!-- Border Outline -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="none" stroke="url(#bezelGrad)" stroke-width="4"/>

  <!-- Letter 'm' -->
  <g filter="url(#mShadow)">
    <text x="512" y="670" 
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', 'Arial', sans-serif" 
          font-size="570" 
          font-weight="900" 
          letter-spacing="-10" 
          text-anchor="middle" 
          fill="url(#mGrad)">m</text>
  </g>
</svg>
