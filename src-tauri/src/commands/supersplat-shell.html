<!doctype html><html><meta charset="utf-8"><title>MVAIGC · Canvas</title><style>body{margin:0;background:#222;color:white;font:14px sans-serif}header{padding:10px;display:flex;gap:15px;align-items:center}iframe{width:100%;height:calc(100vh - 50px);border:0}button{padding:6px}#status{margin-left:auto}</style><header><b>MVAIGC · Canvas</b><button id="save">保存到画布</button><button id="capture">截图到画布</button><button id="view">保存视角到画布</button><select id="views"><option value="">恢复已保存视角</option></select><span id="status">启动中…</span></header><iframe id="editor" src="editor/index.html"></iframe><script>
const frame=document.querySelector('iframe'),status=document.querySelector('#status');
let ready=false,pending=new Map();
function call(command,timeout=120000){return new Promise((resolve,reject)=>{const requestId=crypto.randomUUID();const timer=setTimeout(()=>{pending.delete(requestId);reject(Error('编辑器响应超时'))},timeout);pending.set(requestId,{resolve,reject,timer});frame.contentWindow.postMessage({protocol:1,requestId,command},location.origin)})}
addEventListener('message',e=>{if(e.source!==frame.contentWindow||e.origin!==location.origin||e.data?.protocol!==1)return;const p=pending.get(e.data.requestId);if(!p)return;pending.delete(e.data.requestId);clearTimeout(p.timer);e.data.ok?p.resolve(e.data.result):p.reject(Error(e.data.error?.message))});
async function send(type,data){const response=await fetch('result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,data})});if(!response.ok)throw Error('回传失败')}
function base64(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=()=>reject(r.error);r.readAsDataURL(blob)})}
frame.onload=async()=>{try{for(let i=0;i<60;i++){try{await call({type:'initialize'},500);ready=true;break}catch{}}if(!ready)throw Error('编辑器启动失败');const meta=await(await fetch('session.json')).json();const picker=document.querySelector('#views');for(const view of meta.views??[]){const option=document.createElement('option');option.value=view.id;option.textContent=view.name;picker.append(option)}picker.onchange=()=>{const view=meta.views.find(v=>v.id===picker.value);if(view)call({type:'setView',camera:view.camera}).catch(e=>status.textContent=e.message)};if(meta.folder){await call({type:'openUrl',filename:meta.name,url:new URL('asset/'+meta.name,location.href).href})}else{const blob=await(await fetch('model')).blob();await call({type:'open',file:new File([blob],meta.name)})}status.textContent='已连接画布'}catch(e){status.textContent=e.message}};
for(const type of ['save','capture','view'])document.getElementById(type).onclick=async()=>{if(!ready)return;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{status.textContent='处理中…';const value=await call({type:type==='view'?'getView':type});await send(type,value instanceof Blob?await base64(value):value);status.textContent='已回传画布'}catch(e){status.textContent=e.message}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false)}};
</script></html>
