<!doctype html>
<html><head><meta charset="utf-8"><title>融媒视界 — 产品发布片</title>
<style>
@font-face{font-family:Inter;src:url(fonts/Inter.ttf);font-weight:100 900}
@font-face{font-family:Mono;src:url(fonts/JetBrainsMono-var.ttf);font-weight:100 800}
:root{
  --wall:#07070C; --wall2:#0D0B16;
  --app:#111119; --panel:#171723; --panel2:#1D1D2B; --field:#13131E;
  --line:#2B2B3C; --line2:#3C3C52; --sel:#241A3C;
  --ink:#F3F1FB; --ink2:#BEBAD2; --mute:#858199; --faint:#57536E;
  --acc:#9747FF; --acc2:#CFAAFF; --accT:#251540; --cyan:#3DDCFF; --cyanT:#0E2A33;
  --ok:#3BE08A; --warn:#FFB547; --shadow:rgba(0,0,0,.55);
  --px:#FFD54A; --pxD:#C99C1F;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--wall)}
body{font-family:Inter,"PingFang SC","Hiragino Sans GB",sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
.layer{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#wall{position:absolute;left:-1600px;top:-1200px;width:5120px;height:3480px;background:
  radial-gradient(1200px 820px at 2000px 1500px,#181229 0,transparent 68%),
  radial-gradient(1000px 700px at 3400px 2300px,#101A2A 0,transparent 70%),
  radial-gradient(760px 560px at 2900px 1300px,#1A1230 0,transparent 72%),
  linear-gradient(160deg,#08080E,#0B0A14 60%,#07070C)}
#wall:after{content:'';position:absolute;inset:0;background:radial-gradient(1200px 800px at 2560px 1740px,transparent 40%,rgba(0,0,0,.55) 100%)}
#menubar{position:absolute;left:-1600px;width:5120px;top:0;height:34px;background:rgba(12,11,20,.55);backdrop-filter:blur(18px);display:flex;align-items:center;gap:24px;padding:0 1620px;font-size:13.5px;font-weight:500;color:#8B87A0}
#menubar b{color:#E9E6F5;font-weight:650}#menubar .r{margin-left:auto;display:flex;gap:18px}
.win{position:absolute;background:var(--app);border-radius:16px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.07),0 40px 120px rgba(0,0,0,.75),0 10px 34px rgba(0,0,0,.6)}
.tbar{height:46px;display:flex;align-items:center;padding:0 18px;gap:12px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#16141F,#121019);position:relative}
.lights{display:flex;gap:8px}.lights i{width:12px;height:12px;border-radius:50%;background:#EC6A5E}
.lights i:nth-child(2){background:#F4BF4F}.lights i:nth-child(3){background:#61C554}
.tbar .ttl{position:absolute;left:50%;transform:translateX(-50%);font-size:13.5px;font-weight:600;color:var(--ink2);letter-spacing:.01em}
.tbar .rt{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--mute)}
.app{position:absolute;inset:46px 0 0 0;display:flex;background:var(--app)}
.rail{width:104px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:4px}
.rail .logo{width:44px;height:34px;margin:2px auto 14px;position:relative}
.rail .logo b{position:absolute;left:0;top:0;width:44px;height:16px;background:linear-gradient(180deg,#fff,#C9C3E0);clip-path:polygon(0 0,100% 0,62% 100%,50% 42%,38% 100%)}
.rail .logo b:nth-child(2){top:18px;background:linear-gradient(180deg,#B9A6FF,#9747FF)}
.rail .item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 9px;border-radius:12px;color:var(--mute);font-size:11.5px;font-weight:500}
.rail .item .ic{width:30px;height:30px;border-radius:9px;background:var(--panel2);display:grid;place-items:center;font-size:15px;color:var(--ink2)}
.rail .item.on{background:var(--accT);color:var(--acc2)}
.rail .item.on .ic{background:linear-gradient(140deg,#9747FF,#6A2BC9);color:#fff;box-shadow:0 0 22px rgba(151,71,255,.45)}
.rail .bot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.content{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:58px;flex:none;display:flex;align-items:center;gap:14px;padding:0 24px;border-bottom:1px solid var(--line);background:rgba(17,17,25,.6)}
.top .h1{font-size:22px;font-weight:650;letter-spacing:-.01em}
.top .crumb{font-size:13px;color:var(--mute)}
.top .sp{flex:1}
.btn{height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink2);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.acc{background:linear-gradient(140deg,#9747FF,#6A2BC9);border-color:#B27CFF;color:#fff;box-shadow:0 0 26px rgba(151,71,255,.4)}
.btn.sm{height:32px;padding:0 12px;font-size:12.5px;border-radius:8px}
.tag{height:24px;padding:0 9px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--mute);font-size:11.5px;display:inline-flex;align-items:center;gap:5px}
.tag.acc{background:var(--accT);border-color:#4A2A7A;color:var(--acc2)}
.tag.cy{background:var(--cyanT);border-color:#1D4E5C;color:var(--cyan)}
.body{flex:1;display:flex;min-height:0;position:relative}
.pad{padding:26px 30px}
/* project page */
.pgrid{flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:26px 30px;align-content:start}
.pcard{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.pcard .th{height:206px;position:relative}
.pcard .th .badge{position:absolute;left:10px;top:10px}
.pcard .meta{padding:12px 14px 14px}
.pcard .nm{font-size:16px;font-weight:650}
.pcard .sub{font-size:12.5px;color:var(--mute);margin-top:4px;display:flex;gap:10px}
.newcard{border:1px dashed var(--line2);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--mute);font-size:14px;background:rgba(151,71,255,.05)}
.newcard .plus{width:52px;height:52px;border-radius:14px;border:1px dashed #5C3A92;display:grid;place-items:center;font-size:26px;color:var(--acc2)}
/* script */
.script{flex:1;padding:30px 40px;font-size:19px;line-height:2.05;color:#A9A5BE;position:relative}
.script .ln{padding:2px 10px;border-radius:6px;white-space:nowrap;transition:none}
.script .ln.hl{background:linear-gradient(90deg,rgba(151,71,255,.22),rgba(151,71,255,.02));color:var(--ink)}
.script .ln.hl .k{color:var(--acc2)}
.script .hd{font-size:13px;color:var(--mute);letter-spacing:.14em;margin-bottom:18px;font-family:Mono}
.script .k{color:var(--cyan)}
.ai{width:420px;flex:none;border-left:1px solid var(--line);background:var(--panel);padding:24px 22px;display:flex;flex-direction:column;gap:16px}
.ai .ttl{font-size:13px;color:var(--mute);letter-spacing:.12em;font-family:Mono}
.ai .big{display:flex;align-items:baseline;gap:10px}
.ai .big .n{font-size:62px;font-weight:800;letter-spacing:-.05em;color:var(--ink);font-variant-numeric:tabular-nums}
.ai .big .u{font-size:14px;color:var(--mute)}
.ai .row{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink2);padding:9px 0;border-bottom:1px solid var(--line)}
.ai .row b{color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums}
.ai .bar{height:6px;border-radius:3px;background:#241E33;overflow:hidden;margin-top:6px}
.ai .bar i{display:block;height:100%;background:linear-gradient(90deg,#9747FF,#CFAAFF);border-radius:3px}
.ai .ok{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ok)}
/* storyboard wall */
.sbwrap{flex:1;display:flex;flex-direction:column;min-height:0}
.sbgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;padding:20px 26px;overflow:hidden}
.sb{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden;position:relative}
.sb .th{height:104px;position:relative;overflow:hidden}
.sb .th:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.55))}
.sb .no{position:absolute;left:8px;top:8px;font-family:Mono;font-size:10.5px;font-weight:700;color:#fff;background:rgba(0,0,0,.55);border-radius:5px;padding:2px 6px;letter-spacing:.06em;z-index:2}
.sb .du{position:absolute;right:8px;top:8px;font-family:Mono;font-size:10px;color:#fff;background:rgba(0,0,0,.55);border-radius:5px;padding:2px 6px;z-index:2}
.sb .meta{padding:8px 10px 10px;font-size:11.5px;color:var(--mute);line-height:1.45;height:52px;overflow:hidden}
.sb .meta b{color:var(--ink2);font-weight:600;font-size:12px}
.sb.hot{border-color:var(--acc);box-shadow:0 0 0 2px rgba(151,71,255,.35),0 12px 30px rgba(151,71,255,.22)}
/* canvas */
.cv{flex:1;position:relative;overflow:hidden;background:
  radial-gradient(900px 600px at 50% 45%,rgba(151,71,255,.09),transparent 70%),
  radial-gradient(#2A2740 1px,transparent 1px) 0 0/26px 26px, #0E0D17}
.node{position:absolute;width:216px;border-radius:12px;background:var(--panel);border:1px solid var(--line2);box-shadow:0 14px 34px rgba(0,0,0,.5);overflow:hidden}
.node .nh{height:34px;display:flex;align-items:center;gap:8px;padding:0 11px;font-size:12px;font-weight:650;border-bottom:1px solid var(--line);background:var(--panel2);color:var(--ink2)}
.node .nh .dot{width:8px;height:8px;border-radius:3px}
.node .nc{padding:10px;font-size:11px;color:var(--mute);line-height:1.5}
.node .thumb{height:86px;margin:8px;border-radius:8px}
.node.on{border-color:var(--acc);box-shadow:0 0 0 2px rgba(151,71,255,.4),0 18px 40px rgba(151,71,255,.22)}
.node .badge{position:absolute;right:8px;top:8px;font-family:Mono;font-size:10px;color:#fff;background:var(--acc);border-radius:5px;padding:2px 6px}
.wires{position:absolute;inset:0;pointer-events:none}
.cvbar{position:absolute;left:16px;top:16px;display:flex;gap:8px}
.cvzoom{position:absolute;right:16px;bottom:16px;display:flex;gap:6px;font-family:Mono;font-size:11px;color:var(--mute);background:rgba(20,19,30,.8);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
/* generate */
.gen{flex:1;display:flex;gap:18px;padding:22px 26px;min-height:0}
.gcol{flex:1;display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card.grow{flex:1;min-height:0}
.card .ch{height:38px;flex:none;display:flex;align-items:center;gap:9px;padding:0 13px;font-size:12.5px;font-weight:650;color:var(--ink2);border-bottom:1px solid var(--line);background:var(--panel2)}
.card .ch .sp{flex:1}
.img4{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;flex:1;min-height:0}
.img4 .im{border-radius:8px;position:relative;overflow:hidden}
.img4 .im .num{position:absolute;right:6px;bottom:5px;font-family:Mono;font-size:10px;color:#fff;opacity:.7}
.vidcard{padding:10px}
.vidframe{height:180px;border-radius:9px;position:relative;overflow:hidden}
.vidframe .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);display:grid;place-items:center;color:#fff;font-size:15px}
.vidframe .prog{position:absolute;left:12px;right:12px;bottom:12px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden}
.vidframe .prog i{display:block;height:100%;background:linear-gradient(90deg,#9747FF,#CFAAFF)}
.vidframe .pt{position:absolute;right:12px;bottom:22px;font-family:Mono;font-size:11px;color:#fff;opacity:.85}
.wave{padding:12px 14px}
.wave .wv{display:flex;align-items:center;gap:3px;height:54px}
.wave .wv i{flex:1;border-radius:2px;background:linear-gradient(180deg,#CFAAFF,#9747FF);opacity:.85}
.wave .who{display:flex;gap:10px;font-size:12px;color:var(--mute);margin-top:9px}
.tracks{padding:10px 12px;display:flex;flex-direction:column;gap:9px}
.trk{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.trk.on{border-color:var(--acc);background:var(--accT)}
.trk .nm{font-weight:600}.trk .sp{flex:1}
.trk .eq{display:flex;gap:2px;align-items:flex-end;height:18px}
.trk .eq i{width:3px;border-radius:1px;background:var(--acc2)}
/* team */
.team{flex:1;display:flex;flex-direction:column;padding:24px 28px 120px;gap:18px}
.avrow{display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;box-shadow:0 0 0 2px var(--app)}
.avrow .nm{font-size:13px;color:var(--mute);margin-left:6px}
.cmt{position:relative;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--ink2);max-width:520px;box-shadow:0 14px 30px rgba(0,0,0,.45)}
.cmt .who{font-size:11.5px;color:var(--mute);margin-bottom:5px;display:flex;gap:8px;align-items:center}
.cmt .pin{position:absolute;left:-9px;top:16px;width:16px;height:16px;background:var(--panel);border-left:1px solid var(--line2);border-bottom:1px solid var(--line2);transform:rotate(45deg)}
.vchip{display:flex;gap:8px;align-items:center;font-family:Mono;font-size:11.5px;color:var(--mute)}
.vchip b{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--ink2)}
.vchip b.on{background:var(--accT);border-color:#5A3790;color:var(--acc2)}
/* preview */
.pv{flex:1;display:flex;flex-direction:column;padding:18px 24px 120px;gap:12px;min-height:0}
.pvframe{flex:1;border-radius:12px;overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.pvframe .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.42);backdrop-filter:blur(8px);display:grid;place-items:center;color:#fff;font-size:19px}
.pvframe .ttl{position:absolute;left:26px;top:22px;font-size:14px;font-weight:600;color:rgba(255,255,255,.85);text-shadow:0 2px 10px rgba(0,0,0,.5)}
.pvframe .dur{position:absolute;right:24px;bottom:20px;font-family:Mono;font-size:12px;color:#fff;background:rgba(0,0,0,.45);border-radius:6px;padding:3px 8px}
.tl{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 14px 14px}
.tl .ruler{display:flex;justify-content:space-between;font-family:Mono;font-size:10px;color:var(--faint);margin-bottom:8px}
.tl .row{display:flex;gap:5px;height:52px;position:relative}
.clip{flex:1;border-radius:6px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.1)}
.clip .lab{position:absolute;left:5px;top:4px;font-family:Mono;font-size:9.5px;color:rgba(255,255,255,.85)}
.phd{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--cyan);box-shadow:0 0 12px var(--cyan);z-index:3}
.phd:before{content:'';position:absolute;left:-6px;top:-6px;width:14px;height:10px;border-radius:3px;background:var(--cyan)}
.tl .tl2{display:flex;gap:5px;margin-top:6px;height:20px}
.tl .tl2 .a{flex:1;border-radius:4px;background:linear-gradient(90deg,#2A2140,#241D36);border:1px solid #342A4C}
/* end card */
.endcard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(700px 420px at 50% 44%,rgba(151,71,255,.22),transparent 70%)}
.endcard .mark{width:210px;height:150px;position:relative}
.endcard .mark b{position:absolute;left:0;width:210px;height:72px;background:linear-gradient(180deg,#fff,#C9C3E0);clip-path:polygon(0 0,100% 0,62% 100%,50% 44%,38% 100%)}
.endcard .mark b:nth-child(2){top:78px;background:linear-gradient(180deg,#C3A6FF,#9747FF)}
.endcard .nm{font-size:44px;font-weight:700;letter-spacing:.22em;color:var(--ink)}
.endcard .en{font-family:Mono;font-size:15px;letter-spacing:.34em;color:var(--mute)}
.endcard .slog{font-size:30px;font-weight:600;color:var(--acc2);letter-spacing:.06em;margin-top:8px}
/* pixel sprite */
.px{position:absolute;image-rendering:pixelated;overflow:visible}
/* 成片画面：程序绘制的城市清晨（不用截图） */
.film{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#1A2340 0%,#3C4E7A 32%,#8E6A6A 62%,#D9A06A 100%)}
.film .sun{position:absolute;left:50%;top:52%;width:420px;height:420px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,226,168,.95),rgba(255,180,110,.45) 45%,transparent 70%)}
.film .sky{position:absolute;left:0;right:0;top:0;height:58%;background:radial-gradient(900px 320px at 50% 100%,rgba(151,71,255,.28),transparent 70%)}
.film .city{position:absolute;left:0;right:0;bottom:0;height:46%}
.film .city i{position:absolute;bottom:0;display:block;background:#141828;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.film .city i:after{content:'';position:absolute;inset:6px 5px;background:repeating-linear-gradient(90deg,rgba(255,214,150,.22) 0 3px,transparent 3px 9px),repeating-linear-gradient(180deg,rgba(255,214,150,.18) 0 2px,transparent 2px 8px)}
.film .fog{position:absolute;left:0;right:0;bottom:26%;height:22%;background:linear-gradient(180deg,transparent,rgba(217,160,106,.35),transparent)}
.film .vign{position:absolute;inset:0;background:radial-gradient(1200px 700px at 50% 50%,transparent 45%,rgba(0,0,0,.6) 100%)}

/* ---------- 主页（落地页，按官网真实布局重绘） ---------- */
.homewrap{position:absolute;inset:0;overflow:hidden}
.home{position:absolute;left:50%;top:0;width:1780px;height:1180px;transform:translateX(-50%) scale(.86);transform-origin:50% 0;overflow:hidden;
  background:radial-gradient(1000px 720px at 50% 34%,#2A1758 0,#160D2E 42%,#0A0716 72%,#06040D 100%)}
.home .glow{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55}
.home .g1{left:6%;top:18%;width:520px;height:420px;background:radial-gradient(circle,#6A3BC8,transparent 70%)}
.home .g2{right:4%;top:12%;width:560px;height:460px;background:radial-gradient(circle,#2E63C8,transparent 70%)}
.home .streaks{position:absolute;inset:0;overflow:hidden}
.home .streaks i{position:absolute;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#8B7CFF,#3DDCFF,transparent);opacity:.55;filter:blur(.5px)}
.home .tags{position:absolute;left:0;right:0;top:64px;display:flex;justify-content:center;gap:120px;font-size:17px;letter-spacing:.34em;color:#8E86B8}
.home .wall{position:absolute;left:50%;top:120px;width:1500px;height:470px;transform:translateX(-50%);perspective:1100px;transform-style:preserve-3d}
.home .wall .pane{position:absolute;width:268px;height:154px;border-radius:8px;overflow:hidden;box-shadow:0 22px 50px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.14);opacity:.95}
.home .wall .pane .in{position:absolute;inset:0;background:linear-gradient(160deg,#1B2A4A,#3E5C8C 45%,#C98A5A)}
.home .wall .pane .in:after{content:'';position:absolute;inset:0;background:radial-gradient(200px 120px at 70% 80%,rgba(255,220,180,.35),transparent 70%)}
.home .wall .pane .in i{position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(180deg,transparent,rgba(8,6,16,.8))}
.home .wall .pane .in i:after{content:'';position:absolute;left:8%;right:8%;bottom:0;height:64%;background:repeating-linear-gradient(90deg,rgba(255,220,180,.10) 0 6px,transparent 6px 16px)}
.home .mark{position:absolute;left:50%;top:150px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:14px}
.home .mark img{width:250px;filter:drop-shadow(0 12px 40px rgba(151,71,255,.55))}
.home .mark .nm{font-size:34px;font-weight:700;letter-spacing:.3em;color:#fff;text-shadow:0 4px 24px rgba(120,90,255,.6)}
.home .mark .en{font-family:Mono;font-size:13px;letter-spacing:.42em;color:#9C93C4}
.home .orb{position:absolute;left:50%;top:566px;transform:translate(-50%,-50%);width:118px;height:118px;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#CFEAFF,#7E8CFF 38%,#7A46E0 70%,#4A1FA8 100%);
  box-shadow:0 0 70px rgba(122,70,224,.75),0 0 160px rgba(61,220,255,.35),inset 0 0 26px rgba(255,255,255,.5);
  display:grid;place-items:center;font-size:38px;font-weight:800;color:#fff;letter-spacing:.02em;text-shadow:0 2px 14px rgba(40,10,90,.7)}
